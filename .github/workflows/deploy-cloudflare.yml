name: Deploy to Cloudflare Pages (ersl.pages.dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync publications from Google Scholar
        env:
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID }}
        run: python scripts/fetch_scholar.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Verify Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "Error: CLOUDFLARE_API_TOKEN repository secret is missing or empty."; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "Error: CLOUDFLARE_ACCOUNT_ID repository secret is missing or empty."; exit 1; fi
      - name: Deploy dist to Cloudflare Pages (ersl.pages.dev)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ersl --branch=main --commit-dirty=true
